[workspace]
authors = ["owndev"]
channels = ["conda-forge"]
name = "Open-WebUI-Functions"
platforms = ["linux-64"]

[tasks]
format = "ruff format"
lint = { cmd = "ruff check", depends-on = ["format"] }
# Docker E2E tests (needs Docker + bash), e.g. `pixi run e2e gemini`; see docs/testing.md
e2e = "bash tests/e2e/run.sh"

[dependencies]
ruff = ">=0.11.10,<0.12"
